# Strategic merge patch applied to jet-system/Deployment/jet.
# The mgmt-plane chart ships this Deployment with no SA, no volumes, and no mounts.
# This patch adds the three pieces jet ≥4.9.10 needs to talk mTLS to auth-service.
spec:
  template:
    spec:
      serviceAccountName: spectro-hubble
      volumes:
        - name: authtls
          secret:
            secretName: auth-tls
            defaultMode: 420
      containers:
        - name: jet-manager
          volumeMounts:
            - name: authtls
              mountPath: /secrets/authtls
              readOnly: true
