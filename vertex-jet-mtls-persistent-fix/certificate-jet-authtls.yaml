---
# Creates Secret/auth-tls in jet-system with the same CN + SANs as hubble-system/auth-tls,
# signed by the same intra-microservice CA that auth-service trusts. cert-manager auto-renews
# on the same schedule as the mgmt-plane's own auth-tls.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auth-tls
  namespace: jet-system
  labels:
    spectrocloud.com/purpose: "jet-authservice-mtls-persistent-fix"
spec:
  secretName: auth-tls           # MUST be this name — jet Deployment (patched below) mounts it
  commonName: auth-service       # MUST be this CN — auth-service authorizes on this identity
  dnsNames:
    - auth
    - auth-service
    - auth-service.hubble-system
    - spectrocloud.com
  duration: 8760h                # 1 year
  renewBefore: 720h              # 30 days
  usages:
    - client auth
    - server auth
    - digital signature
    - key encipherment
  issuerRef:
    name: hubble-intermicrosvccom-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
